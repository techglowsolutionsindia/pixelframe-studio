<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HTML Sitemap | PixelFrame Studio</title>

    <meta
      name="description"
      content="Explore PixelFrame Studio's photography services, portfolio, about us, creative process, packages, FAQs and session booking."
    />

    <meta name="robots" content="noindex, follow" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/images/logo/pixelframe-favicon.svg"
    />

    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f8f6f2;
        color: #292521;
        line-height: 1.7;
      }

      .container {
        width: min(100% - 40px, 900px);
        margin: 0 auto;
      }

      header {
        padding: 24px 0;
        background: #ffffff;
        border-bottom: 1px solid #e8e1d8;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        color: #292521;
        text-decoration: none;
      }

      .brand img {
        display: block;
        width: auto;
        max-width: 240px;
        height: 60px;
        object-fit: contain;
      }

      main {
        padding: 60px 0 80px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 42px);
      }

      .intro {
        margin-bottom: 36px;
        color: #665e55;
      }

      .sitemap-card {
        padding: 30px;
        background: #ffffff;
        border: 1px solid #e8e1d8;
        border-radius: 16px;
      }

      h2 {
        margin: 0 0 20px;
        font-size: 23px;
      }

      ul {
        margin: 0;
        padding-left: 24px;
      }

      li {
        margin-bottom: 12px;
      }

      a {
        color: #987345;
      }

      a:hover,
      a:focus-visible {
        color: #75542e;
        text-decoration: underline;
      }

      footer {
        padding: 24px 0;
        background: #292521;
        color: #ffffff;
        text-align: center;
        font-size: 14px;
      }

      @media (max-width: 600px) {
        main {
          padding: 40px 0 60px;
        }

        .sitemap-card {
          padding: 22px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Header Started -->
    <header>
      <div class="container">
        <a
          href="index.html#top"
          class="brand"
          aria-label="PixelFrame Studio - Home"
        >
          <img
            src="assets/images/logo/pixelframe-logo.svg"
            alt="PixelFrame Studio"
            width="240"
            height="60"
          />
        </a>
      </div>
    </header>
    <!-- Header Ended -->

    <!-- Sitemap Main Started -->
    <main class="container">
      <h1>HTML Sitemap</h1>

      <p class="intro">
        Explore the main sections of the PixelFrame Studio website.
      </p>

      <section class="sitemap-card" aria-labelledby="sitemap-heading">
        <h2 id="sitemap-heading">Website Sections</h2>

        <ul>
          <li><a href="index.html#top">Home</a></li>
          <li><a href="index.html#services">Photography Services</a></li>
          <li><a href="index.html#portfolio">Portfolio</a></li>
          <li><a href="index.html#about">About Us</a></li>
          <li><a href="index.html#process">Our Process</a></li>
          <li><a href="index.html#packages">Photography Packages</a></li>
          <li><a href="index.html#faqs">Frequently Asked Questions</a></li>
          <li><a href="index.html#booking">Book a Session</a></li>
        </ul>
      </section>
    </main>
    <!-- Sitemap Main Ended -->

    <!-- Footer Started -->
    <footer>
      <div class="container">
        &copy; 2026 PixelFrame Studio. All Rights Reserved.
      </div>
    </footer>
    <!-- Footer Ended -->
  </body>
</html>
